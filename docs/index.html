<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Husjagt · Svenstrup, Godthåb & Støvring</title>
<meta name="theme-color" content="#1f3a34">
<style>
  :root{
    --bg:#f5f2ec; --card:#fff; --ink:#1d2421; --mut:#6b746f; --line:#e3ded4;
    --brand:#1f3a34; --accent:#c8553d; --good:#2e7d4f; --warn:#b7791f; --chip:#ebe6dc;
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#141816;--card:#1d2321;--ink:#eef1ef;--mut:#9aa39e;--line:#2c3431;--brand:#9fd3c0;--chip:#2a312e}
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:14px 16px calc(10px);padding-top:max(14px,env(safe-area-inset-top))}
  @media (prefers-color-scheme: dark){header{color:#0f1412}}
  header h1{margin:0;font-size:20px;letter-spacing:.2px}
  header .sub{font-size:13px;opacity:.85}
  .bar{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:4}
  .bar::-webkit-scrollbar{display:none}
  .pill{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
  .pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  main{max-width:1100px;margin:0 auto;padding:12px 12px 80px}
  .status{color:var(--mut);font-size:13px;margin:4px 4px 12px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
  .card.vaek{opacity:.55}
  .img{position:relative;aspect-ratio:16/10;background:var(--chip) center/cover no-repeat}
  .tags{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px}
  .tag.ny{background:var(--accent)} .tag.fald{background:var(--good)} .tag.vaek{background:#555}
  .fav{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:20px;cursor:pointer;line-height:40px}
  .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
  .pris{font-size:20px;font-weight:700}
  .pris small{font-size:13px;font-weight:500;color:var(--good);margin-left:6px}
  .adr{font-weight:600} .adr span{display:block;font-weight:400;color:var(--mut);font-size:13px}
  .facts{display:flex;flex-wrap:wrap;gap:6px}
  .f{background:var(--chip);border-radius:7px;padding:3px 8px;font-size:13px}
  .f.ok{outline:1.5px solid var(--good)} .f.mangler{outline:1.5px dashed var(--warn)} .f.nej{outline:1.5px solid var(--accent)}
  .links{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
  .links a{flex:1;text-align:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px;font-size:14px;font-weight:600}
  textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--bg);color:var(--ink);resize:vertical;min-height:38px}
  .tom{text-align:center;color:var(--mut);padding:50px 20px}
  /* filterpanel */
  dialog{border:0;border-radius:18px 18px 0 0;width:100%;max-width:560px;margin:auto auto 0;padding:0;background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  .panel{padding:18px 18px max(18px,env(safe-area-inset-bottom))}
  .panel h2{margin:0 0 12px;font-size:18px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row label{font-weight:500}
  .row input[type=number],.row select{width:130px;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  .row input[type=checkbox]{width:22px;height:22px}
  .knapper{display:flex;gap:10px;margin-top:16px}
  .knapper button{flex:1;padding:12px;border-radius:11px;border:1px solid var(--line);font:inherit;font-weight:600;background:var(--bg);color:var(--ink)}
  .knapper .primaer{background:var(--brand);color:#fff;border-color:var(--brand)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:20}
</style>
</head>
<body>
<header>
  <h1>🏡 Husjagt</h1>
  <div class="sub">Svenstrup, Godthåb og Støvring</div>
</header>

<div class="bar" id="bar">
  <button class="pill" id="btnFilter">⚙︎ Filtre</button>
  <button class="pill" data-hurtig="match">✓ Opfylder krav</button>
  <button class="pill" data-hurtig="ny">Nye (7 dage)</button>
  <button class="pill" data-hurtig="fav">♥ Favoritter</button>
  <select class="pill" id="sort">
    <option value="ny">Nyeste først</option>
    <option value="prisOp">Pris ↑</option>
    <option value="prisNed">Pris ↓</option>
    <option value="kvm">Størst først</option>
    <option value="kvmpris">Laveste kr/m²</option>
  </select>
  <button class="pill" id="btnDel">Del favoritter</button>
</div>

<main>
  <div class="status" id="status">Henter huse…</div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="dlg">
  <form method="dialog" class="panel" id="frm">
    <h2>Krav til huset</h2>
    <div class="row"><label for="kvm">Min. boligareal (m²)</label><input type="number" id="kvm" step="5"></div>
    <div class="row"><label for="vaer">Min. værelser (inkl. stue)</label><input type="number" id="vaer" min="1"></div>
    <div class="row"><label for="bad">Min. badeværelser</label><input type="number" id="bad" min="0"></div>
    <div class="row"><label for="badUkendt">Vis også hvis antal bad er ukendt</label><input type="checkbox" id="badUkendt"></div>
    <div class="row"><label for="aar">Bygget i eller efter</label><input type="number" id="aar"></div>
    <div class="row"><label for="pris">Maks. pris (kr.)</label><input type="number" id="pris" step="50000"></div>
    <div class="row"><label for="by9230">Svenstrup / Godthåb (9230)</label><input type="checkbox" id="by9230"></div>
    <div class="row"><label for="by9530">Støvring (9530)</label><input type="checkbox" id="by9530"></div>
    <div class="row"><label for="visVaek">Vis solgte/fjernede</label><input type="checkbox" id="visVaek"></div>
    <div class="knapper">
      <button value="nulstil" id="nulstil">Nulstil</button>
      <button value="ok" class="primaer">Vis huse</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
const STANDARD = {kvm:150, vaer:5, bad:2, badUkendt:true, aar:1990, pris:4000000, by9230:true, by9530:true, visVaek:false};
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let krav = Object.assign({}, STANDARD, LS.get("husjagt-krav", {}));
let hurtig = LS.get("husjagt-hurtig", {match:true, ny:false, fav:false});
let sortering = LS.get("husjagt-sort", "ny");
let favs = LS.get("husjagt-favs", {});   // id -> {note}
let huse = [], opdateret = "";

const kr = n => n == null ? "–" : n.toLocaleString("da-DK") + " kr.";
const $ = id => document.getElementById(id);
const dageSiden = d => Math.round((Date.now() - new Date(d)) / 864e5);

function toast(t){ const el=$("toast"); el.textContent=t; el.style.display="block"; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display="none",2500); }

// Importér favoritter fra et delt link (#fav=...)
function importerDelte(){
  const m = location.hash.match(/fav=([^&]+)/);
  if(!m) return;
  try{
    const delt = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    let n = 0;
    for(const [id, v] of Object.entries(delt)){
      if(!favs[id]){ favs[id] = v; n++; }
      else if(v.note && !(favs[id].note||"").includes(v.note)) { favs[id].note = [favs[id].note, v.note].filter(Boolean).join("\n— "); n++; }
    }
    LS.set("husjagt-favs", favs);
    history.replaceState(null, "", location.pathname);
    toast(n ? `${n} favoritter tilføjet` : "Favoritterne var allerede her");
  }catch(e){ toast("Kunne ikke læse det delte link"); }
}

function badStatus(h){
  if(h.bad == null) return "mangler";
  return h.bad >= krav.bad ? "ok" : "nej";
}
function opfylder(h){
  if(h.kvm != null && h.kvm < krav.kvm) return false;
  if(h.vaerelser != null && h.vaerelser < krav.vaer) return false;
  if(h.byggeaar != null && h.byggeaar < krav.aar) return false;
  if(h.pris != null && h.pris > krav.pris) return false;
  if(h.bad == null ? !krav.badUkendt : h.bad < krav.bad) return false;
  if(h.kvm == null || h.vaerelser == null || h.byggeaar == null) return false;
  return true;
}
function synlig(h){
  if(!h.aktiv && !krav.visVaek && !favs[h.id]) return false;
  if(h.postnr === "9230" && !krav.by9230) return false;
  if(h.postnr === "9530" && !krav.by9530) return false;
  if(hurtig.match && !opfylder(h)) return false;
  if(hurtig.ny && dageSiden(h.foerstSet) > 7) return false;
  if(hurtig.fav && !favs[h.id]) return false;
  return true;
}
function prisfald(h){
  const p = h.prishistorik || [];
  if(p.length < 2) return 0;
  return p[0].pris - p[p.length-1].pris;
}

function kort(h){
  const nyt = dageSiden(h.foerstSet) <= 7 && h.aktiv;
  const fald = prisfald(h);
  const fav = !!favs[h.id];
  const bs = badStatus(h);
  const f = (txt, ok) => `<span class="f ${ok}">${txt}</span>`;
  const facts = [
    f(`${h.kvm ?? "?"} m²`, h.kvm==null?"mangler":h.kvm>=krav.kvm?"ok":"nej"),
    f(`${h.vaerelser ?? "?"} vær.`, h.vaerelser==null?"mangler":h.vaerelser>=krav.vaer?"ok":"nej"),
    f(h.bad==null ? "Bad: tjek selv" : `${h.bad} bad`, bs),
    f(`Bygget ${h.byggeaar ?? "?"}`, h.byggeaar==null?"mangler":h.byggeaar>=krav.aar?"ok":"nej"),
    h.grund ? f(`Grund ${h.grund.toLocaleString("da-DK")} m²`, "") : "",
    h.energi ? f(`Energi ${h.energi}`, "") : "",
    (h.pris && h.kvm) ? f(`${Math.round(h.pris/h.kvm).toLocaleString("da-DK")} kr/m²`, "") : ""
  ].join("");
  const links = (h.links || [{kilde:h.kilde, url:h.url}]).map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.kilde} ↗</a>`).join("");
  const dage = h.aktiv ? (h.dage != null ? `${h.dage} dage til salg` : `Set første gang ${new Date(h.foerstSet).toLocaleDateString("da-DK")}`) : "Ikke længere til salg";
  return `<article class="card ${h.aktiv?"":"vaek"}">
    <div class="img" style="background-image:url('${h.billede||""}')">
      <div class="tags">${nyt?'<span class="tag ny">NY</span>':""}${fald>0?`<span class="tag fald">↓ ${kr(fald)}</span>`:""}${!h.aktiv?'<span class="tag vaek">Væk</span>':""}</div>
      <button class="fav" data-fav="${h.id}" aria-label="Favorit">${fav?"❤️":"🤍"}</button>
    </div>
    <div class="body">
      <div class="pris">${kr(h.pris)}</div>
      <div class="adr">${h.adresse}<span>${h.postnr} ${h.by||""} · ${dage}</span></div>
      <div class="facts">${facts}</div>
      ${fav ? `<textarea data-note="${h.id}" placeholder="Jeres noter…">${(favs[h.id].note||"").replace(/</g,"&lt;")}</textarea>` : ""}
      <div class="links">${links}</div>
    </div>
  </article>`;
}

function tegn(){
  for(const b of document.querySelectorAll("[data-hurtig]")) b.classList.toggle("on", !!hurtig[b.dataset.hurtig]);
  $("sort").value = sortering;
  const vis = huse.filter(synlig);
  const s = {
    ny:(a,b)=> (b.foerstSet||"").localeCompare(a.foerstSet||"") || (a.dage??1e9)-(b.dage??1e9),
    prisOp:(a,b)=>(a.pris??1e12)-(b.pris??1e12),
    prisNed:(a,b)=>(b.pris??0)-(a.pris??0),
    kvm:(a,b)=>(b.kvm??0)-(a.kvm??0),
    kvmpris:(a,b)=>((a.pris/a.kvm)||1e9)-((b.pris/b.kvm)||1e9)
  }[sortering];
  vis.sort((a,b)=> (b.aktiv-a.aktiv) || s(a,b));
  const aktive = huse.filter(h=>h.aktiv).length;
  const nye = vis.filter(h=>dageSiden(h.foerstSet)<=7 && h.aktiv).length;
  $("status").textContent = `${vis.length} huse vist${nye?` · ${nye} nye`:""} · ${aktive} villaer til salg i alt · opdateret ${opdateret ? new Date(opdateret).toLocaleDateString("da-DK",{day:"numeric",month:"long"}) : "?"}`;
  $("grid").innerHTML = vis.length ? vis.map(kort).join("") :
    `<div class="tom">Ingen huse lige nu, der passer på filtrene.<br>Prøv at slå "Opfylder krav" fra for at se alle.</div>`;
}

function fyldForm(){ for(const k in STANDARD){ const el=$(k); if(el.type==="checkbox") el.checked=!!krav[k]; else el.value=krav[k]; } }
function laesForm(){ for(const k in STANDARD){ const el=$(k); krav[k] = el.type==="checkbox" ? el.checked : Number(el.value)||0; } LS.set("husjagt-krav", krav); }

$("btnFilter").onclick = () => { fyldForm(); $("dlg").showModal(); };
$("frm").addEventListener("submit", e => { if(e.submitter && e.submitter.value==="nulstil"){ krav=Object.assign({},STANDARD); fyldForm(); e.preventDefault(); return; } laesForm(); tegn(); });
$("dlg").addEventListener("click", e => { if(e.target === $("dlg")) $("dlg").close(); });
for(const b of document.querySelectorAll("[data-hurtig]")) b.onclick = () => { hurtig[b.dataset.hurtig] = !hurtig[b.dataset.hurtig]; LS.set("husjagt-hurtig", hurtig); tegn(); };
$("sort").onchange = e => { sortering = e.target.value; LS.set("husjagt-sort", sortering); tegn(); };
$("grid").addEventListener("click", e => {
  const b = e.target.closest("[data-fav]"); if(!b) return;
  const id = b.dataset.fav;
  if(favs[id]){ if(favs[id].note && !confirm("Fjern favorit og noter?")) return; delete favs[id]; } else favs[id] = {note:""};
  LS.set("husjagt-favs", favs); tegn();
});
$("grid").addEventListener("input", e => {
  const t = e.target.closest("[data-note]"); if(!t) return;
  favs[t.dataset.note].note = t.value; LS.set("husjagt-favs", favs);
});
$("btnDel").onclick = async () => {
  if(!Object.keys(favs).length){ toast("Ingen favoritter at dele endnu"); return; }
  const url = location.origin + location.pathname + "#fav=" + btoa(unescape(encodeURIComponent(JSON.stringify(favs))));
  try{
    if(navigator.share){ await navigator.share({title:"Vores favorithuse", url}); return; }
    await navigator.clipboard.writeText(url); toast("Link kopieret – send det til din kone");
  }catch(e){ prompt("Kopiér linket:", url); }
};

importerDelte();
fetch("data/huse.json?t=" + Date.now()).then(r => r.json()).then(d => {
  opdateret = d.opdateret;
  huse = Object.values(d.huse || {});
  tegn();
}).catch(() => { $("status").textContent = "Kunne ikke hente husene endnu – første opdatering kører måske stadig."; });
</script>
</body>
</html>
